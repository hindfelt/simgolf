<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b2d;color:#f5e6bb;font:13px system-ui}canvas{display:block;width:100%;height:100%}#status{position:absolute;inset:0;display:grid;place-content:center;background:#183b2d}#controls{position:absolute;top:12px;right:12px;display:flex;gap:5px}button{min-width:40px;min-height:40px;border:1px solid #b9aa6b;border-radius:8px;background:#173324ee;color:#f5e6bb;font:18px system-ui;cursor:pointer}button:hover{background:#365840}button:focus-visible{outline:3px solid #f5d77b;outline-offset:2px}button:disabled{opacity:.4;cursor:default}#caption{position:absolute;bottom:12px;left:12px;background:#173324dc;padding:8px 12px;border:1px solid #b9aa6b;border-radius:8px;font-size:11px;pointer-events:none}</style></head><body><div id="status">Preparing your property…</div><nav id="controls" aria-label="Preview camera"><button id="rotate-left" aria-label="Rotate left">↶</button><button id="rotate-right" aria-label="Rotate right">↷</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="reset-view" aria-label="Reset view">⌂</button></nav><div id="caption">In-game view · Your starting property</div><script type="module" src="/src/terrain-preview-scene.js"></script></body></html>
